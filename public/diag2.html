<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Module diag 2</title></head>
<body>
<div id="out" style="font-family: monospace; white-space: pre-wrap; padding: 20px;">testing...</div>
<script type="module">
  const out = document.getElementById('out');
  const log = (m) => { out.textContent += '\n' + m; };
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      log('SW registrations: ' + regs.length);
      for (const r of regs) { await r.unregister(); log('unregistered SW scope=' + r.scope); }
    } else {
      log('no serviceWorker API');
    }
    log('controller before: ' + (navigator.serviceWorker.controller ? 'yes' : 'no'));
    const m = await import('/js/app.js?v=2');
    log('MODULE LOADED OK');
  } catch (e) {
    log('MODULE FAILED: ' + (e && e.message ? e.message : String(e)));
  }
</script>
</body>
</html>
