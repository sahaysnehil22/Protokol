<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PROTOKOL — Trazabilidad de Calidad Vial</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0284C7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Sistema de trazabilidad de calidad para infraestructura vial pública en Perú (Directiva N° 017-2023-CG/GMPL)" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/forms.css" />
</head>
<body>
  <!-- Fixed Header -->
  <header class="app-header">
    <a href="/" class="brand" id="brand-link">
      <span style="font-size: 20px;">🛣️</span>
      <div>
        <div class="brand-logo">PROTOKOL</div>
        <div class="brand-subtitle">Vial • Ayacucho</div>
      </div>
    </a>

    <!-- Header Actions -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- Expandable header search (visible on portal view only) -->
      <div id="header-search" style="display: none; align-items: center; gap: 4px;">
        <input
          type="text"
          id="header-search-input"
          class="form-input"
          autocomplete="off"
          style="display: none; width: 0; opacity: 0; transition: width 0.22s ease, opacity 0.22s ease; font-size: 13px; height: 32px; min-height: 32px; border-radius: 16px; padding: 0 12px;"
        />
        <button id="btn-header-search" class="btn btn-outline" title="Buscar proyectos"
          style="min-height: 32px; height: 32px; width: 32px; padding: 0; font-size: 14px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          🔍
        </button>
      </div>
      <!-- Language Switcher -->
      <button id="btn-lang-toggle" class="btn btn-outline" style="min-height: 32px; height: 32px; padding: 0 10px; font-size: 11px; font-weight: 800; border-radius: 16px;">
        EN
      </button>

      <!-- Online/Offline Sync Pill -->
      <div id="status-pill" class="status-pill" title="Toque para ver la cola de sincronización">
        <span class="status-dot"></span>
        <span id="status-text">ONLINE</span>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <main id="app-content">
    <div style="text-align: center; padding: 40px 10px; color: var(--color-text-secondary);">
      <div style="font-size: 32px; margin-bottom: 12px; animation: pulse 1.2s infinite;">⚙️</div>
      <p style="font-weight: 700;">Iniciando PROTOKOL...</p>
      <p id="boot-debug" style="display: none; font-size: 11px; color: #DC2626; margin-top: 16px; word-break: break-word; max-width: 90vw;"></p>
    </div>
  </main>

  <!-- Offline Queue Slide-up Drawer -->
  <div id="queue-drawer" class="drawer-backdrop">
    <div class="drawer-panel" id="queue-drawer-panel"></div>
  </div>

  <!-- Boot diagnostics: surface module/eval errors into the DOM so a frozen
       splash always explains itself (field debugging + automated QA). -->
  <script>
    (function () {
      function showBootError(msg) {
        try {
          var d = document.getElementById('boot-debug');
          if (d) {
            d.style.display = 'block';
            d.textContent = (d.textContent ? d.textContent + ' | ' : 'Error de inicio: ') + msg;
          }
        } catch (e) { /* never break boot reporting */ }
      }
      window.addEventListener('error', function (e) {
        showBootError((e.message || 'unknown error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showBootError('promise: ' + (r && r.message ? r.message : String(r)));
      });
      // If the module never even starts (import failure, CSP, etc.), the
      // splash would sit forever with no clue — report after a timeout.
      setTimeout(function () {
        var content = document.getElementById('app-content');
        if (content && content.textContent.indexOf('Iniciando PROTOKOL') !== -1) {
          showBootError('el módulo de la app no arrancó (revise consola del navegador)');
          // Probe the module graph with the browser's own fetch stack to find
          // which file fails (network vs CORS vs SW cache).
          var files = ['/js/app.js', '/js/db.js', '/js/sync.js', '/js/i18n.js',
            '/js/location.js', '/js/views/identify.js', '/js/views/project_portal.js'];
          (async function () {
            for (var i = 0; i < files.length; i++) {
              try {
                var r = await fetch(files[i], { cache: 'no-store' });
                if (!r.ok) showBootError('probe ' + files[i] + ' -> HTTP ' + r.status);
              } catch (e) {
                showBootError('probe ' + files[i] + ' -> ' + (e && e.message ? e.message : e));
              }
            }
            showBootError('probe terminado');
          })();
        }
      }, 20000);
    })();
  </script>

  <!-- Main Application Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
