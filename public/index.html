<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PROTOKOL — Trazabilidad de Calidad Vial</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0284C7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Sistema de trazabilidad de calidad para infraestructura vial pública en Perú (Directiva N° 017-2023-CG/GMPL)" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/forms.css" />
</head>
<body>
  <!-- Fixed Header -->
  <header class="app-header">
    <a href="/" class="brand" id="brand-link">
      <span style="font-size: 20px;">🛣️</span>
      <div>
        <div class="brand-logo">PROTOKOL</div>
        <div class="brand-subtitle">Vial • Ayacucho</div>
      </div>
    </a>

    <!-- Header Actions -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- Language Switcher -->
      <button id="btn-lang-toggle" class="btn btn-outline" style="min-height: 32px; height: 32px; padding: 0 10px; font-size: 11px; font-weight: 800; border-radius: 16px;">
        EN
      </button>

      <!-- Online/Offline Sync Pill -->
      <div id="status-pill" class="status-pill" title="Toque para ver la cola de sincronización">
        <span class="status-dot"></span>
        <span id="status-text">ONLINE</span>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <main id="app-content">
    <div style="text-align: center; padding: 40px 10px; color: var(--color-text-secondary);">
      <div style="font-size: 32px; margin-bottom: 12px; animation: pulse 1.2s infinite;">⚙️</div>
      <p style="font-weight: 700;">Iniciando PROTOKOL...</p>
    </div>
  </main>

  <!-- Offline Queue Slide-up Drawer -->
  <div id="queue-drawer" class="drawer-backdrop">
    <div class="drawer-panel" id="queue-drawer-panel"></div>
  </div>

  <!-- Main Application Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
