<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Module diag</title></head>
<body>
<div id="out" style="font-family: monospace; white-space: pre-wrap; padding: 20px;">testing...</div>
<script type="module">
  const out = document.getElementById('out');
  try {
    const m = await import('/js/app.js');
    out.textContent = 'MODULE LOADED OK. exports: ' + Object.keys(m).join(',');
  } catch (e) {
    out.textContent = 'MODULE FAILED: ' + (e && e.message ? e.message : String(e));
  }
</script>
</body>
</html>
